[project]
name = "parcel-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.1.1",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-core>=1.6.6",
    "langchain-text-splitters>=1.1.3",
    "pandas>=2.2",
    "pydantic>=2.13.5",
    "pyogrio>=0.10",
    "python-dotenv>=1.2.4",
    "requests>=2.32",
    "shapely>=2.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
]

[tool.uv]
package = false
