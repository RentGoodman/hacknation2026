[project]
name = "extraction"
version = "0.1.0"
description = "LLM extraction of rental housing rule records from the source corpus, with verbatim quote checks"
readme = "README.md"
authors = [
    { name = "leopoldj4" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
extraction = "extraction:main"

[project.optional-dependencies]
anthropic = [
    "langchain-anthropic>=1.7.5",
]
openai = [
    "langchain-openai>=1.6.7",
]
google = [
    "langchain-google-genai>=4.4.0",
]
ollama = [
    "langchain-ollama>=1.1.0",
]
openrouter = [
    "langchain-openrouter>=0.2.9",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
